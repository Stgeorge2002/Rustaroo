[package]
name = "rustaroo"
version = "1.1.0"
authors = ["Gerry Tonkin-Hill, Neil MacAlistair, Chris Ruis and Aaron Weimann (Rust port)"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Stgeorge2002/rustaroo"
description = "Rustaroo: a Rust pangenome analysis pipeline"

[lib]
name = "rustaroo"
path = "src/lib.rs"

[[bin]]
name = "rustaroo"
path = "src/main.rs"

[dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"
indicatif = "0.17"
log = "0.4"
env_logger = "0.10"

# Bio dependencies - using conservative versions
bio = "0.42"
petgraph = "0.6"
flate2 = "1.0"

# Scientific computing
ndarray = "0.15"
nalgebra = "0.31"
statrs = "0.16"
ordered-float = "3.4"

# Utilities
tempfile = "3.8"
walkdir = "2.3"
regex = "1.9"
memchr = "2"
once_cell = "1.18"
itertools = "0.11"
dashmap = "5.5"
parking_lot = "0.12"
rand = "0.8"

# External tool integration
which = "4.4"

[profile.release]
# Whole-program optimisation; does not change floating-point semantics or output.
lto = "fat"
codegen-units = 1
