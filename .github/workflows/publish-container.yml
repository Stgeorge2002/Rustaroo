name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v1.0.0" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false

      - name: Verify release version
        run: |
          actual=$(python3 -c 'import tomllib; print(tomllib.load(open("release-source/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$actual" != "$VERSION" ]]; then
            echo "Tag version $VERSION does not match Cargo.toml version $actual" >&2
            exit 1
          fi
          echo "SOURCE_REVISION=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: ./release-source
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image and bundled tools
        run: |
          docker run --rm "$IMAGE" --version | tee version.txt
          grep -Fx "rustaroo $VERSION" version.txt
          docker run --rm --entrypoint sh "$IMAGE" -ec \
            'command -v cd-hit; command -v cd-hit-est; mafft --version'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        run: docker push "$IMAGE"
